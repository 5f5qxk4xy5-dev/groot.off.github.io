<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Emirate City RP</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      /* Fond bleu */
      background:
        radial-gradient(circle at 20% 30%, #8b2cff55, transparent 35%),
        radial-gradient(circle at 80% 70%, #a020f055, transparent 35%),
        linear-gradient(135deg, #061b4f, #07112f 55%, #16052d);

      color: white;
      overflow: hidden;
    }

    .accueil {
      padding: 30px;
    }

    h1 {
      font-size: clamp(45px, 10vw, 100px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 4px;

      /* Texte violet */
      color: #b84cff;

      /* Effet lumineux */
      text-shadow:
        0 0 10px #9b27ff,
        0 0 25px #9b27ff,
        0 0 50px #7a00ff;

      animation: apparition 1.5s ease;
    }

    p {
      margin-top: 20px;
      font-size: 20px;
      color: #d8c8ff;
      letter-spacing: 2px;
    }

    .bouton {
      display: inline-block;
      margin-top: 35px;
      padding: 15px 35px;

      background: #8b2cff;
      color: white;

      text-decoration: none;
      font-size: 18px;
      font-weight: bold;

      border-radius: 10px;

      box-shadow:
        0 0 15px #8b2cff,
        0 0 35px #8b2cff66;

      transition: 0.3s;
    }

    .bouton:hover {
      transform: scale(1.08);
      background: #a94dff;
      box-shadow:
        0 0 25px #a94dff,
        0 0 50px #a94dff;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <div class="accueil">

    <h1>Emirate City RP</h1>

    <p>Bienvenue dans votre nouvelle ville RP</p>

    <a href="#" class="bouton">
      Rejoindre le serveur
    </a>

  </div>

</body>
</html>
